[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betaggregator"
version = "0.1.0"
description = "Betting-odds aggregator: generates slip codes, scrapes bookmaker sites, persists and displays slips in real time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-SocketIO>=5.3,<6",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "Celery>=5.3,<6",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selenium>=4.21",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    "gevent>=24.2",
    "gevent-websocket>=0.10.1",
    "whitenoise>=6.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are autogenerated — keep them out of lint.
"migrations/*" = ["ALL"]

[tool.ruff.format]
# Alembic-generated files are excluded from formatting.
exclude = ["migrations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
