services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betaggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betaggregator}
      POSTGRES_DB: ${POSTGRES_DB:-betaggregator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betaggregator} -d ${POSTGRES_DB:-betaggregator}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agg-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agg-network

  web:
    build: .
    command: ["/srv/betaggregator/scripts/entrypoint.sh", "web"]
    environment: &app-env
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-betaggregator}:${POSTGRES_PASSWORD:-betaggregator}@db:5432/${POSTGRES_DB:-betaggregator}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SOCKETIO_ASYNC_MODE: ${SOCKETIO_ASYNC_MODE:-gevent}
    ports:
      - "${WEB_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agg-network
      - npm-shared-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: ["/srv/betaggregator/scripts/entrypoint.sh", "worker"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agg-network

  beat:
    build: .
    command: ["/srv/betaggregator/scripts/entrypoint.sh", "beat"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agg-network

networks:
  npm-shared-net:
    external: true
  agg-network:
    driver: bridge

volumes:
  pgdata: